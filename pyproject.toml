[project]
name = "headmodel"
version = "0.1.3"
description = "SimNIBS-format head model folder (m2m) from a T1 MRI on the GPU in about a minute, checked against charm"
requires-python = ">=3.11"
dependencies = ["numpy", "nibabel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
